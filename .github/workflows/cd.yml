name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag; defaults to the selected commit SHA"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "CD is restricted to refs/heads/main"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: franchise-hub-cd-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag and repository URI
        run: |
          set -euo pipefail
          image_tag="${{ inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            image_tag="$GITHUB_SHA"
          fi
          repository_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URI=$repository_uri" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          set -euo pipefail
          docker build \
            --tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" \
            --tag "$ECR_REPOSITORY_URI:latest" \
            .
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Start ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --desired-count 1 \
            --force-new-deployment \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

      - name: Resolve task public IP
        run: |
          set -euo pipefail
          task_arn="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --service-name "$ECS_SERVICE_NAME" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)"
          eni_id="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$task_arn" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)"
          public_ip="$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$eni_id" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)"
          echo "TASK_PUBLIC_IP=$public_ip" >> "$GITHUB_ENV"

      - name: Smoke test health
        run: |
          set -euo pipefail
          curl --silent --fail --retry 12 --retry-delay 5 \
            "http://$TASK_PUBLIC_IP:8080/actuator/health" \
            | jq --exit-status '.status == "UP"' >/dev/null
