version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - export AWS_REGION="${AWS_DEFAULT_REGION}"
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse HEAD)}"
  build:
    commands:
      - ./mvnw checkstyle:check
      - export TEST_MONGO_IMAGE="public.ecr.aws/docker/library/mongo:8.0"
      - ./mvnw clean test
      - ./mvnw package -DskipTests
      - docker build --tag "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" --tag "${ECR_REPOSITORY_URI}:latest" .
  post_build:
    commands:
      - docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
      - docker push "${ECR_REPOSITORY_URI}:latest"
      - printf '[{"name":"franchise-hub","imageUri":"%s"}]' "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
